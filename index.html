<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a78d6">
<title>Sotuv Audit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root { color-scheme: light dark; --bg:#f6f6f3; --card:#fff; --fg:#111; --muted:#6b6b6b; --acc:#2a78d6; --line:#e1e0d9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0d0d; --card:#1a1a19; --fg:#f4f4f1; --muted:#9a9a93; --acc:#3987e5; --line:#2c2c2a; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); padding:16px; }
  main { width:min(400px,100%); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; text-align:center; display:grid; gap:14px; }
  img { width:72px; height:72px; margin:0 auto; border-radius:18px; }
  h1 { margin:0; font-size:22px; }
  p { margin:0; color:var(--muted); font-size:14px; line-height:1.5; }
  .btn { display:block; padding:12px; border-radius:10px; font-weight:600; font-size:15px; text-decoration:none; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; font-family:inherit; }
  .btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  .hint { font-size:13px; text-align:left; background:color-mix(in srgb, var(--acc) 12%, transparent); padding:10px 12px; border-radius:10px; color:var(--fg); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>Sotuv Audit</h1>
  <p id="m">Saytga ulanmoqda…</p>
  <a id="open" class="btn primary" href="#" hidden>Saytni ochish</a>
  <button id="install" class="btn" hidden>📲 Ilova qilib o'rnatish</button>
  <div id="ios" class="hint" hidden>iPhone'da: pastdagi <b>Ulashish</b> (⬆) tugmasi → <b>"Bosh ekranga qo'shish"</b>.</div>
  <p id="note" hidden>Ilova o'rnatilgach, uni telefon yoki kompyuter ekranidagi <b>Sotuv Audit</b> belgisidan ochasiz.</p>
</main>
<script>
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let target = null, timer = null, deferred = null;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  const go = () => { if (target) location.replace(target + location.hash); };
  // Ilovadan ochilsa – darhol saytga; brauzerda – 3 soniya ichida (o'rnatish tugmasini bosishga ulgurish uchun)
  fetch('url.txt?t=' + Date.now(), { cache: 'no-store' })
    .then((r) => r.text())
    .then((u) => {
      u = u.trim();
      if (!/^https:\/\/[a-z0-9.-]+\.trycloudflare\.com\/?$/.test(u)) throw new Error();
      target = u;
      const a = document.getElementById('open'); a.href = u; a.hidden = false;
      if (standalone) return go();
      document.getElementById('m').textContent = "Saytga o'tilmoqda…";
      timer = setTimeout(go, 3000);
      if (isIOS) { document.getElementById('ios').hidden = false; clearTimeout(timer); document.getElementById('m').textContent = 'Saytni ochish yoki ilova qilib o\'rnatish:'; }
    })
    .catch(() => { document.getElementById('m').textContent = "Sayt hozir o'chiq (ofis kompyuteri o'chirilgan bo'lishi mumkin). Birozdan keyin qayta urinib ko'ring."; });

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferred = e;
    const b = document.getElementById('install'); b.hidden = false;
    document.getElementById('note').hidden = false;
  });
  document.getElementById('install').addEventListener('click', async () => {
    clearTimeout(timer);
    document.getElementById('m').textContent = "O'rnatish oynasi ochildi…";
    if (!deferred) return;
    deferred.prompt();
    const r = await deferred.userChoice;
    document.getElementById('m').textContent = r.outcome === 'accepted' ? "Ilova o'rnatildi! Endi uni ekrandagi belgidan oching." : "Saytni ochish uchun yuqoridagi tugmani bosing.";
    deferred = null; document.getElementById('install').hidden = true;
  });
</script>
</body>
</html>
